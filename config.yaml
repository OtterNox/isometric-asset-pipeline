source:
  model: black-forest-labs/FLUX.1-schnell
  width: 768
  height: 768
  steps: 4
  guidance: 0.0
  seed_offset: 1000
  prompt_suffix: >
    isolated game asset concept,
    centered,
    full object visible,
    clean neutral background,
    readable silhouette,
    suitable for image-to-3d reconstruction

  lora:
    enabled: false
    path: /workspace/models/source-style.safetensors
    weight: 0.8

trellis:
  model: microsoft/TRELLIS.2-4B
  resolution: 512
  texture_size: 1024
  decimation_target: 200000
  remesh: true

blender:
  executable: blender
  render_size: 512
  transparent: true
  engine: BLENDER_EEVEE_NEXT

  camera:
    elevation_deg: 35.264

  views:
    ne: 45
    nw: 135
    sw: 225
    se: 315

pixel:
  model: stabilityai/stable-diffusion-xl-base-1.0
  controlnet: diffusers/controlnet-canny-sdxl-1.0
  prompt: >
    pixel art game sprite,
    crisp edges,
    limited color palette,
    clean readable silhouette
  negative_prompt: >
    blurry,
    photorealistic,
    smooth gradients,
    distorted geometry

  lora:
    path: /workspace/models/pixel-art.safetensors
    weight: 0.85

  denoise: 0.25
  control_strength: 0.9
  steps: 12
  guidance: 4.0
  final_size: 128

paths:
  workspace: /workspace
  specs: /workspace/specs
  sources: /workspace/sources
  meshes: /workspace/meshes
  renders: /workspace/renders
  sprites: /workspace/sprites
  cache: /workspace/cache
  models: /workspace/models
  errors: /workspace/errors

runtime:
  gpu_hourly_cost: 0.49
  stop_on_error: false
  skip_existing: true
